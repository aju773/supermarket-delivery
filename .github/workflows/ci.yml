name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-checks:
    name: Design tokens, contrast and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:tokens
      - run: pnpm check:contrast
      - run: pnpm test:unit
      - run: pnpm typecheck

  stack-tests:
    name: API tests and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: API tests (pytest against Postgres)
        run: docker compose run --rm api pytest
      - name: Start the stack
        run: |
          docker compose up --build --detach
          timeout 180 sh -c 'until curl -sf http://localhost:8090/ > /dev/null; do sleep 2; done'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        run: docker compose logs
