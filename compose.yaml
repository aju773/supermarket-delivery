# Local development stack: `docker compose up --build`, then open http://localhost:${PROXY_PORT}.
# The proxy sends /api to Django and everything else to Next.js, so the site lives on one domain.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    env_file: .env
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    env_file: .env
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Product photos the api saves under api/media, served at /media.
      - ./api/media:/srv/media:ro
    depends_on:
      - api
      - web

volumes:
  db-data:
